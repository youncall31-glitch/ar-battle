  });
  $('btn-starter-skip').addEventListener('click', () => {
    closeStarter();
    logStatus('처음 잡은 포켓몬이 파트너가 되어 같이 싸워요. 아래 포켓볼을 위로 밀어서 던져 보세요!');
  });

  // 11. [추가] 걸어서 포켓몬 만나기 — 걸음 수(움직임 센서, 실내도 OK) + 켜면 GPS 이동 거리 중 큰 값으로 계산
  const ENCOUNTER_DIST = 40, STEP_LEN = 0.7, IDLE_REPLACE_MS = 12000;
  const walk = { steps: 0, gps: 0, lastFix: null, gpsOn: false, watchId: null, pending: false, listening: false, gotMotion: false,
    lp: 9.8, base: 9.8, armed: true, lastStep: 0, quietUntil: 0, checkAt: 0 };
  const walkPill = $('walk-pill'), walkFill = $('walk-fill'), walkText = $('walk-text');
  const walkedMeters = () => Math.max(walk.steps * STEP_LEN, walk.gps);
  async function ensureMotion() {
    if (walk.listening || typeof window.DeviceMotionEvent === 'undefined') return;
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      let r = 'denied';
      try { r = await DeviceMotionEvent.requestPermission(); } catch (_) {}
      if (r !== 'granted') return;
    }
    if (walk.listening) return;
    window.addEventListener('devicemotion', onDeviceMotion);
    walk.listening = true;
  }
  // 걸음 감지: 흔들림 크기에서 중력 성분을 빼고, 위로 솟는 순간을 한 걸음으로 셈 (0.28초 이상 간격)
  function onDeviceMotion(e) {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null) return;
    walk.gotMotion = true;
    const m = Math.hypot(a.x, a.y, a.z);
    walk.lp += (m - walk.lp) * 0.35;
    walk.base += (m - walk.base) * 0.02;
    const d = walk.lp - walk.base, now = performance.now();
    if (now < walk.quietUntil) return;                      // 화면을 만지는 중의 흔들림은 걸음으로 안 셈
    if (walk.armed && d > 1.25 && now - walk.lastStep > 280) {
      walk.armed = false;
      walk.lastStep = now;
      walk.steps++;
      onWalkProgress();
    } else if (!walk.armed && d < 0.3) walk.armed = true;
  }
  function toggleGps() {
    if (walk.gpsOn) {
      navigator.geolocation.clearWatch(walk.watchId);
      walk.gpsOn = false; walk.lastFix = null;
      updateWalkPill();
      logStatus('📍 GPS를 껐어요. 걸음 수로만 이동 거리를 계산해요.');
      return;
    }
    if (!navigator.geolocation) { logStatus('이 브라우저는 위치(GPS)를 쓸 수 없어요. 걸음 수로 계산해요.'); return; }
    walk.gpsOn = true;
    walk.watchId = navigator.geolocation.watchPosition(onGpsFix, onGpsError, { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
    updateWalkPill();
    logStatus(`📍 GPS를 켰어요. 밖에서 ${ENCOUNTER_DIST}m 걸을 때마다 새 포켓몬을 만나요. (다시 누르면 꺼져요)`);
  }
  function haversine(a, b) {
    const R = 6371000, k = Math.PI / 180, dLat = (b.lat - a.lat) * k, dLon = (b.lon - a.lon) * k;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * k) * Math.cos(b.lat * k) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function onGpsFix(pos) {
    const c = pos.coords;
    if (!c || c.accuracy > 35) return;                     // 너무 부정확한 위치는 버림
    const fix = { lat: c.latitude, lon: c.longitude, t: pos.timestamp || Date.now() };
    if (!walk.lastFix) { walk.lastFix = fix; return; }
    const d = haversine(walk.lastFix, fix), dt = Math.max(1, (fix.t - walk.lastFix.t) / 1000);
    if (d < 3) return;                                      // 제자리 흔들림은 모아서 3m가 넘으면 반영
    walk.lastFix = fix;
    if (d / dt > 7) return;                                 // 차를 타거나 위치가 튀면 제외
    walk.gps += d;
    onWalkProgress();
  }
  function onGpsError(err) {
    if (err && err.code === 1) {
      walk.gpsOn = false;
      updateWalkPill();
      logStatus('위치 권한이 거부됐어요. 걸음 수로만 이동 거리를 계산해요.');
    }
  }
  function updateWalkPill() {
    const m = walkedMeters();
    walkText.textContent = (walk.gpsOn ? '📍 ' : '') + (walk.pending ? '👣 새 포켓몬 기척!' : `👣 ${Math.max(0, Math.ceil(ENCOUNTER_DIST - m))}m`);
    walkFill.style.width = `${Math.min(100, Math.round(m / ENCOUNTER_DIST * 100))}%`;
    walkPill.classList.toggle('pending', walk.pending);
    walkPill.setAttribute('aria-label', walk.pending ? '근처에 새 포켓몬이 있어요' : `다음 포켓몬까지 약 ${Math.max(0, Math.ceil(ENCOUNTER_DIST - m))}m. 누르면 GPS 켜기/끄기`);
  }
  function onWalkProgress() {
    updateWalkPill();
    if (walkedMeters() < ENCOUNTER_DIST || walk.pending) return;
    if (canStartWalkEncounter()) startWalkEncounter();
    else {
      walk.pending = true;
      updateWalkPill();
      logStatus('👣 근처에서 다른 포켓몬의 기척이 느껴져요! 지금 승부가 끝나면 나타나요.');
    }
  }
  function canStartWalkEncounter() {
    if (uiPaused()) return false;
    const now = performance.now();
    if (pokeData.state === 'CAPTURED') return now - (pokeData.capturedAt || 0) > 2500;
    if (['CATCHING', 'APPEARING', 'SPAWNING'].includes(pokeData.state) || catchSeq) return false;
    return now - encounter.interactedAt > IDLE_REPLACE_MS;  // 한동안 안 건드린 포켓몬은 새 포켓몬으로 바뀜
  }
  function startWalkEncounter() {
    const fled = isTargetActive() ? currentPokemon.name : null;
    walk.steps = 0; walk.gps = 0; walk.pending = false;
    spawnPokemon(randomWild(), { fromWalk: true, fled });
    try { if (navigator.vibrate) navigator.vibrate([60, 40, 120]); } catch (_) {}
    updateWalkPill();
  }
  function updateWalk(now) {
    if (now < walk.checkAt) return;
    walk.checkAt = now + 500;
    measureUiBounds();                                       // 상태 문구 길이에 따라 HUD 높이가 바뀜
    if (walk.pending && canStartWalkEncounter()) startWalkEncounter();
  }
  walkPill.addEventListener('click', () => { ensureMotion(); toggleGps(); });
  // 공을 던지거나 조준하느라 휴대폰을 흔드는 동안은 걸음으로 세지 않음
  canvas.addEventListener('pointerdown', () => { walk.quietUntil = performance.now() + 700; }, true);
  canvas.addEventListener('pointermove', () => { walk.quietUntil = performance.now() + 700; }, true);

  // 12. [추가] 카드 인식
  //    카드 그림 창·색 배치·명암 구조를 숫자 특징으로 바꿔, 미리 등록한 카드와 비교합니다.
  //    외부 서버·라이브러리 없이 기기 안에서만 계산하고, 등록 정보는 이 브라우저에만 저장돼요.
  const CARD_ASPECT = 63 / 88;        // 포켓몬 카드 규격 63×88mm
  const CARD_MATCH_MIN = 0.70;        // 이 점수 이상이면 같은 카드로 봄
  const CARD_MATCH_MARGIN = 0.05;     // 다른 포켓몬 카드보다 이만큼은 더 비슷해야 함
  const CARD_MIN_CONTRAST = 7;        // 틀 안이 너무 밋밋하면(벽·바닥) 인식하지 않음
  const CARD_STREAK = 3;              // 연속 3번(약 0.7초) 같은 카드로 보이면 소환
  const MAX_CARDS = 30;
  const CARD_STORE_KEY = 'arBattle.cards.v1';

  function sourceSize(src) {
    if (src.videoWidth) return { w: src.videoWidth, h: src.videoHeight };
    if (src.naturalWidth) return { w: src.naturalWidth, h: src.naturalHeight };
    return { w: src.width, h: src.height };
  }
  // 사각형(r)을 잘라 그림. 원본 밖으로 나간 부분은 회색으로 채워 위치가 밀리지 않게 함
  function drawCrop(g, source, r, dw, dh) {
    const { w, h } = sourceSize(source);
    g.fillStyle = '#808080';
    g.fillRect(0, 0, dw, dh);
    const x0 = Math.max(0, r.sx), y0 = Math.max(0, r.sy);
    const x1 = Math.min(w, r.sx + r.sw), y1 = Math.min(h, r.sy + r.sh);
    if (x1 <= x0 || y1 <= y0) return;
    const kx = dw / r.sw, ky = dh / r.sh;
    g.drawImage(source, x0, y0, x1 - x0, y1 - y0, (x0 - r.sx) * kx, (y0 - r.sy) * ky, (x1 - x0) * kx, (y1 - y0) * ky);
  }

  const CardMatcher = (() => {
    const W = 48, H = 66, N = W * H;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    const LIN = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const c = i / 255; LIN[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    const labF = (t) => (t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116);
    const TW = 10, TH = 14;                            // 카드 안쪽 명암 썸네일 (가장자리 6%는 배경이 섞이므로 제외)
    const AW = 20, AH = 13;                            // 그림 창 명암 썸네일
    const ART = { x0: 4, y0: 7, x1: 44, y1: 34 };      // 카드 x 8~92%, y 10~52% = 포켓몬 그림이 있는 자리
    const L = new Float32Array(N), A = new Float32Array(N), B = new Float32Array(N);

    function blockAverage(src, x0, y0, w, h, ow, oh) {
      const out = new Float32Array(ow * oh);
      for (let j = 0; j < oh; j++) {
        const ys = y0 + Math.floor(j * h / oh), ye = y0 + Math.floor((j + 1) * h / oh);
        for (let i = 0; i < ow; i++) {
          const xs = x0 + Math.floor(i * w / ow), xe = x0 + Math.floor((i + 1) * w / ow);
          let s = 0, n = 0;
          for (let y = ys; y < ye; y++) for (let x = xs; x < xe; x++) { s += src[y * W + x]; n++; }
          out[j * ow + i] = n ? s / n : 0;
        }
      }
      return out;
    }
    // 틀을 angle(라디안)만큼 돌려서 잘라 그림 (등록할 때 살짝 기울어진 사본을 만들 때 사용)
    function drawRotated(g, source, r, angle) {
      g.save();
      g.fillStyle = '#808080';
      g.fillRect(0, 0, W, H);
      g.translate(W / 2, H / 2);
      g.rotate(angle);
      g.scale(W / r.sw, H / r.sh);
      g.translate(-(r.sx + r.sw / 2), -(r.sy + r.sh / 2));
      g.drawImage(source, 0, 0);
      g.restore();
    }
    function describe(source, rect, angle) {
      if (angle) drawRotated(ctx, source, rect, angle);
      else drawCrop(ctx, source, rect, W, H);
      const px = ctx.getImageData(0, 0, W, H).data;
      let sumL = 0;
      for (let i = 0, p = 0; i < N; i++, p += 4) {
        const r = LIN[px[p]], g = LIN[px[p + 1]], b = LIN[px[p + 2]];
        const fx = labF((0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047);
        const fy = labF(0.2126 * r + 0.7152 * g + 0.0722 * b);
        const fz = labF((0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883);
        L[i] = 116 * fy - 16; A[i] = 500 * (fx - fy); B[i] = 200 * (fy - fz);
        sumL += L[i];
      }
      const meanL = sumL / N;
      let v = 0;
      for (let i = 0; i < N; i++) v += (L[i] - meanL) * (L[i] - meanL);
      const stdL = Math.sqrt(v / N);
      const thumb = blockAverage(L, 4, 4, 40, 58, TW, TH);
      const art = blockAverage(L, ART.x0, ART.y0, ART.x1 - ART.x0, ART.y1 - ART.y0, AW, AH);
      const grid = new Float32Array(4 * 6 * 3);           // 4×6 칸의 평균 밝기(정규화)·색
      for (let gy = 0; gy < 6; gy++) for (let gx = 0; gx < 4; gx++) {
        let sl = 0, sa = 0, sb = 0, n = 0;
        for (let y = gy * 11; y < (gy + 1) * 11; y++) for (let x = gx * 12; x < (gx + 1) * 12; x++) {
          const i = y * W + x; sl += L[i]; sa += A[i]; sb += B[i]; n++;
        }
        const k = (gy * 4 + gx) * 3;
        grid[k] = (sl / n - meanL) / Math.max(stdL, 1); grid[k + 1] = sa / n; grid[k + 2] = sb / n;
      }
      const hist = new Float32Array(27);                  // 색상 12구간×채도 2 + 무채색 3
      for (let i = 0; i < N; i++) {
        const c = Math.hypot(A[i], B[i]);
        if (c < 10) { hist[L[i] < 35 ? 24 : L[i] < 70 ? 25 : 26] += 1; continue; }
        const hf = (Math.atan2(B[i], A[i]) + Math.PI) / (2 * Math.PI) * 12 - 0.5;
        const h0 = Math.floor(hf), w1 = hf - h0, cc = c < 30 ? 0 : 1;
        hist[(((h0 % 12) + 12) % 12) * 2 + cc] += 1 - w1;
        hist[((((h0 + 1) % 12) + 12) % 12) * 2 + cc] += w1;
      }
      for (let i = 0; i < 27; i++) hist[i] /= N;
      return { thumb, art, grid, hist, contrast: stdL };
    }
    // 정규화 상호상관 (±1칸 어긋남까지 허용)
    function ncc(a, b, w, h) {
      let best = -1;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        let n = 0, sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0;
        for (let y = Math.max(0, dy); y < Math.min(h, h + dy); y++) {
          for (let x = Math.max(0, dx); x < Math.min(w, w + dx); x++) {
            const va = a[y * w + x], vb = b[(y - dy) * w + (x - dx)];
            n++; sa += va; sb += vb; saa += va * va; sbb += vb * vb; sab += va * vb;
          }
        }
        const cov = sab - sa * sb / n, vA = saa - sa * sa / n, vB = sbb - sb * sb / n;
        if (vA > 1e-6 && vB > 1e-6) best = Math.max(best, cov / Math.sqrt(vA * vB));
      }
      return best;
    }
    function gridSim(a, b) {
      let dL = 0, dC = 0;
      const n = a.length / 3;
      for (let i = 0; i < a.length; i += 3) {
        dL += Math.abs(a[i] - b[i]);
        dC += Math.hypot(a[i + 1] - b[i + 1], a[i + 2] - b[i + 2]);
      }
      return Math.max(0, 1 - (dL / n) / 2.4 - (dC / n) / 50);
    }
    function similarity(a, b) {
      let hist = 0;
      for (let i = 0; i < 27; i++) hist += Math.min(a.hist[i], b.hist[i]);
      return 0.45 * Math.max(0, ncc(a.art, b.art, AW, AH))
           + 0.20 * Math.max(0, ncc(a.thumb, b.thumb, TW, TH))
           + 0.20 * hist
           + 0.15 * gridSim(a.grid, b.grid);
    }
    function parts(a, b) { // 점수 구성 확인용
      let hist = 0;
      for (let i = 0; i < 27; i++) hist += Math.min(a.hist[i], b.hist[i]);
      return { art: ncc(a.art, b.art, AW, AH), thumb: ncc(a.thumb, b.thumb, TW, TH), hist, grid: gridSim(a.grid, b.grid) };
    }
    const round = (arr, d) => Array.from(arr, (x) => Math.round(x * d) / d);
    const toJSON = (s) => ({ t: round(s.thumb, 10), a: round(s.art, 10), g: round(s.grid, 100), h: round(s.hist, 10000), c: Math.round(s.contrast * 10) / 10 });
    const fromJSON = (o) => ({ thumb: Float32Array.from(o.t), art: Float32Array.from(o.a), grid: Float32Array.from(o.g), hist: Float32Array.from(o.h), contrast: o.c });
    return { describe, similarity, parts, toJSON, fromJSON };
  })();

  // 등록할 때 틀을 조금씩 키우고 줄이고 옮긴 사본도 함께 저장 → 비출 때 위치가 조금 달라도 인식
  function augmentCrops(r) {
    return [[0.94, 0, 0], [1.06, 0, 0], [1, 0.035, 0], [1, -0.035, 0], [1, 0, 0.03], [1, 0, -0.03]].map(([s, dx, dy]) => {
      const sw = r.sw * s, sh = r.sh * s;
      return { sx: r.sx + (r.sw - sw) / 2 + dx * r.sw, sy: r.sy + (r.sh - sh) / 2 + dy * r.sh, sw, sh };
    });
  }
  function buildCardSamples(source, rect) {
    const samples = [rect].concat(augmentCrops(rect)).map((r) => CardMatcher.describe(source, r));
    for (const angle of [-0.07, 0.07]) samples.push(CardMatcher.describe(source, rect, angle)); // ±4° 기울인 사본
    return samples;
  }
  // 카드의 포켓몬 그림 부분만 잘라 작은 JPEG로 보관 (목록 썸네일 + 공식 그림을 못 받을 때 대신 표시)
  function extractCardArt(source, rect) {
    const ar = { sx: rect.sx + rect.sw * 0.08, sy: rect.sy + rect.sh * 0.10, sw: rect.sw * 0.84, sh: rect.sh * 0.42 };
    const w = 320, h = Math.round(w * ar.sh / ar.sw);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    drawCrop(c.getContext('2d'), source, ar, w, h);
    try { return c.toDataURL('image/jpeg', 0.82); } catch (_) { return null; }
  }

  const cardStore = { cards: [], persistent: true };
  function loadCards() {
    const raw = storageGet(CARD_STORE_KEY);
    if (!raw) return;
    try {
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.cards)) {
        const valid = (s) => s && s.t && s.t.length === 140 && s.a && s.a.length === 260 && s.h && s.h.length === 27;
        cardStore.cards = data.cards.filter((c) => c && Array.isArray(c.samples) && c.samples.every(valid) && c.samples.length)
          .map((c) => Object.assign({}, c, { samples: c.samples.map(CardMatcher.fromJSON) }));
      }
    } catch (_) { /* 손상된 저장값은 무시 */ }
  }
  function saveCards() {
    const data = { v: 1, cards: cardStore.cards.map((c) => Object.assign({}, c, { samples: c.samples.map(CardMatcher.toJSON) })) };
    cardStore.persistent = storageSet(CARD_STORE_KEY, JSON.stringify(data));
    return cardStore.persistent;
  }
  function matchCards(desc) {
    let best = null;
    const scored = cardStore.cards.map((card) => {
      let s = 0;
      for (const smp of card.samples) s = Math.max(s, CardMatcher.similarity(desc, smp));
      return { card, score: s };
    });
    for (const r of scored) if (!best || r.score > best.score) best = r;
    // 2등은 '다른 포켓몬' 카드 중에서 (같은 포켓몬 카드를 두 장 등록해도 헷갈리지 않게)
    let second = null;
    for (const r of scored) if (best && r.card.id !== best.card.id && (!second || r.score > second.score)) second = r;
    return { best, second };
  }
  function decideCard(m) {
    if (!m.best || m.best.score < CARD_MATCH_MIN) return null;
    if (m.second && m.best.score - m.second.score < CARD_MATCH_MARGIN) return null;
    return m.best.card;
  }

  // 카드 스캔 화면
  const scannerEl = $('scanner'), scanFrame = $('scan-frame'), scanStatus = $('scan-status'), scanTitle = $('scan-title');
  const scanMain = $('scan-main'), regSheet = $('reg-sheet'), alignBar = $('align-bar');
  const cardList = $('card-list'), photoInput = $('photo-input'), photoView = $('photo-view');
  const regSelect = $('reg-select'), regCustom = $('reg-custom'), regDex = $('reg-dex'), regName = $('reg-name'), regThumb = $('reg-thumb');
  const btnCaptureLive = $('btn-capture-live'), alignZoom = $('align-zoom');
  const photoStage = { purpose: null, s0: 1, zoom: 1, tx: 0, ty: 0, pointers: new Map(), pinch: null };
  let pendingCapture = null; // 찍어 둔 카드 (어떤 포켓몬인지 고르기 전)

  function setScanStatus(msg) { scanStatus.textContent = msg; }
  function showScanPanel(name) {
    scanMain.hidden = name !== 'main';
    regSheet.hidden = name !== 'label';
    alignBar.hidden = name !== 'align';
    scanFrame.hidden = name === 'label'; // 포켓몬을 고를 땐 틀이 필요 없음
    scanFrame.classList.toggle('still', name === 'align'); // 사진을 맞출 땐 움직이는 스캔 줄을 숨김
    scanTitle.textContent = name === 'label' ? '어떤 포켓몬 카드인가요?'
      : name === 'align' ? '사진 속 카드를 틀에 맞춰 주세요' : '카드를 틀 안에 꽉 차게 맞춰 주세요';
    layoutScanFrame();
  }
  // 위·아래 안내판을 피해 남는 공간 한가운데에 카드 비율(63:88) 틀을 배치 (작은 화면·가로 화면 대응)
  function layoutScanFrame() {
    if (scannerEl.hidden || scanFrame.hidden) return;
    const vw = window.innerWidth, vh = window.innerHeight;
    const topR = document.querySelector('.scan-top').getBoundingClientRect();
    const botR = document.querySelector('.scan-bottom').getBoundingClientRect();
    let x0 = 16, x1 = vw - 16, y0 = topR.bottom + 14, y1 = botR.top - 14;
    if (topR.left > vw * 0.4) { x1 = topR.left - 16; y0 = 14; y1 = vh - 14; } // 가로 화면: 안내판이 오른쪽에 있음
    const h = Math.max(120, Math.min(y1 - y0, (x1 - x0) * 0.82 / CARD_ASPECT, vh * 0.56, 460));
    scanFrame.style.width = `${Math.round(h * CARD_ASPECT)}px`;
    scanFrame.style.height = `${Math.round(h)}px`;
    scanFrame.style.left = `${Math.round((x0 + x1) / 2)}px`;
    scanFrame.style.top = `${Math.round((y0 + y1) / 2)}px`;
  }
  function refreshScannerNotice() {
    btnCaptureLive.disabled = !isCameraLive();
    if (!scanner.open || scanner.mode !== 'live' || scanMain.hidden) return; // 이름 고르기·사진 맞추기 중엔 안내를 덮어쓰지 않음
    if (!isCameraLive()) {
      setScanStatus(`카메라가 꺼져 있어서(${cameraReason || '연결 안 됨'}) 실시간 인식은 안 돼요. 사진으로 등록·인식은 할 수 있어요.`);
    } else if (!cardStore.cards.length) {
      setScanStatus('아직 등록된 카드가 없어요. 카드를 틀에 꽉 차게 맞추고 [📷 이 카드 등록]을 눌러 주세요.');
    } else {
      setScanStatus('카드를 틀 안에 꽉 차게 맞추면 자동으로 인식해요.');
    }
  }
  function openScanner() {
    scanner.open = true; scanner.mode = 'live'; scanner.streak = 0; scanner.lastUid = null; scanner.busy = false;
    pendingCapture = null;
    uiLayer.hidden = true;
    canvas.style.visibility = 'hidden'; // 3D 물체가 카드 틀을 가리지 않게 (인식은 원래 카메라 영상으로 함)
    scannerEl.hidden = false;
    scanFrame.classList.remove('found');
    renderCardList();
    showScanPanel('main');
    refreshScannerNotice();
    layoutScanFrame();
    clearInterval(scanner.timer);
    scanner.timer = setInterval(scanTick, 220);
  }
  function closeScanner() {
    scanner.open = false;
    clearInterval(scanner.timer);
    hidePhotoStage();
    scannerEl.hidden = true;
    uiLayer.hidden = false;
    canvas.style.visibility = '';
    measureUiBounds();
  }
  // 화면 위 틀 위치 → 카메라 영상 좌표 (영상은 object-fit: cover로 잘려 보임)
  function videoCropForFrame() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    const vr = video.getBoundingClientRect(), fr = scanFrame.getBoundingClientRect();
    const scale = Math.max(vr.width / vw, vr.height / vh);
    const offX = (vw * scale - vr.width) / 2, offY = (vh * scale - vr.height) / 2;
    return { sx: (fr.left - vr.left + offX) / scale, sy: (fr.top - vr.top + offY) / scale, sw: fr.width / scale, sh: fr.height / scale };
  }
  function scanTick() {
    if (!scanner.open || scanner.mode !== 'live' || scanner.busy || scanMain.hidden) return;
    if (!isCameraLive()) { refreshScannerNotice(); return; }
    if (performance.now() < scanner.resumeAt) return;
    const crop = videoCropForFrame();
    if (!crop) return;
    const desc = CardMatcher.describe(video, crop);
    if (!cardStore.cards.length) { refreshScannerNotice(); return; }
    if (desc.contrast < CARD_MIN_CONTRAST) {
      scanner.streak = 0; scanner.lastUid = null;
      scanFrame.classList.remove('found');
      setScanStatus('카드를 틀 안에 맞춰 주세요.');
      return;
    }
    const m = matchCards(desc);
    const card = decideCard(m);
    if (card) {
      scanner.streak = scanner.lastUid === card.uid ? scanner.streak + 1 : 1;
      scanner.lastUid = card.uid;
      scanFrame.classList.add('found');
      setScanStatus(`${card.name} 카드 같아요! 그대로 잠깐만요… (${Math.round(m.best.score * 100)}%)`);
      if (scanner.streak >= CARD_STREAK) summonFromCard(card);
    } else {
      scanner.streak = 0; scanner.lastUid = null;
      scanFrame.classList.remove('found');
      setScanStatus(m.best && m.best.score >= 0.55
        ? `카드를 찾는 중… (${m.best.card.name} 카드와 ${Math.round(m.best.score * 100)}% 비슷해요)`
        : '카드를 찾는 중… 등록한 카드를 틀에 꽉 차게 비춰 주세요.');
    }
  }
  function summonFromCard(card) {
    closeScanner();
    spawnPokemon({ id: card.id, name: card.name, speed: card.speed, dodgeRate: card.dodgeRate, card }, { fromCard: true });
  }

  function renderCardList() {
    cardList.textContent = '';
    if (!cardStore.cards.length) {
      const p = document.createElement('p');
      p.className = 'card-empty';
      p.textContent = '등록된 카드가 없어요.';
      cardList.appendChild(p);
      return;
    }
    for (const card of cardStore.cards) {
      const item = document.createElement('div');
      item.className = 'card-chip';
      const summon = document.createElement('button');
      summon.type = 'button';
      summon.className = 'card-summon';
      summon.title = `${card.name} 바로 소환`;
      if (card.art) {
        const img = document.createElement('img');
        img.src = card.art; img.alt = '';
        summon.appendChild(img);
      }
      const label = document.createElement('span');
      label.textContent = card.name;
      summon.appendChild(label);
      summon.addEventListener('click', () => summonFromCard(card));
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'card-del';
      del.textContent = '×';
      del.setAttribute('aria-label', `${card.name} 카드 삭제`);
      del.addEventListener('click', () => {
        if (!del.classList.contains('armed')) { // 한 번 더 눌러야 삭제 (실수 방지)
          del.classList.add('armed'); del.textContent = '삭제?';
          setTimeout(() => { del.classList.remove('armed'); del.textContent = '×'; }, 3000);
          return;
        }
        deleteCard(card.uid);
      });
      item.append(summon, del);
      cardList.appendChild(item);
    }
  }
  function deleteCard(uid) {
    const card = cardStore.cards.find((c) => c.uid === uid);
    cardStore.cards = cardStore.cards.filter((c) => c.uid !== uid);
    saveCards();
    const art = artTextureCache.get(uid);
    artTextureCache.delete(uid);
    if (art) art.then((t) => { if (t && spriteUniforms.uMap.value !== t) t.dispose(); });
    renderCardList();
    refreshScannerNotice();
    if (card) setScanStatus(`${card.name} 카드를 지웠어요.`);
  }

  function populateRegSelect() {
    regSelect.textContent = '';
    POKEMON_LIST.forEach((p, i) => {
      const o = document.createElement('option');
      o.value = String(i); o.textContent = `${p.name} (No.${p.id})`;
      regSelect.appendChild(o);
    });
    const o = document.createElement('option');
    o.value = 'custom'; o.textContent = '다른 포켓몬 (도감 번호 입력)';
    regSelect.appendChild(o);
  }
  regSelect.addEventListener('change', () => { regCustom.hidden = regSelect.value !== 'custom'; });
  regDex.addEventListener('input', () => { // 도감 번호를 넣으면 이름을 바로 보여 줌
    const id = parseInt(regDex.value, 10);
    regName.placeholder = DEX[id] ? `${DEX[id].name} (${typeNames(id)})` : '예: 이브이';
  });
  function cardLimitReached() {
    if (cardStore.cards.length < MAX_CARDS) return false;
    setScanStatus(`카드는 ${MAX_CARDS}장까지 등록할 수 있어요. 안 쓰는 카드를 지워 주세요.`);
    return true;
  }
  function readRegistrationForm() {
    if (regSelect.value !== 'custom') return { idx: Number(regSelect.value) };
    const id = parseInt(regDex.value, 10);
    if (!(id >= 1 && id <= 1025)) { setScanStatus('도감 번호는 1~1025 사이 숫자로 입력해 주세요.'); regDex.focus(); return null; }
    return { id, name: regName.value.trim() };
  }
  async function resolveRegistrationInfo(form) {
    if (form.idx !== undefined) {
      const p = POKEMON_LIST[form.idx];
      return { id: p.id, name: p.name, speed: p.speed, dodgeRate: p.dodgeRate };
    }
    const name = form.name || (DEX[form.id] ? DEX[form.id].name : null) || (await fetchKoreanName(form.id)) || `No.${form.id}`;
    const b = DEX[form.id] ? battleInfo(form.id, 10) : DEFAULT_STATS;
    return { id: form.id, name, speed: b.speed, dodgeRate: b.dodgeRate };
  }
  async function fetchKoreanName(id) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 4000);
      const res = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`, { signal: ctl.signal });
      clearTimeout(timer);
      if (!res.ok) return null;
      const data = await res.json();
      const ko = (data.names || []).find((n) => n.language && n.language.name === 'ko');
      return ko ? ko.name : null;
    } catch (_) { return null; }
  }
  function finishRegistration(info, samples, art) {
    const card = {
      uid: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      id: info.id, name: info.name, speed: info.speed, dodgeRate: info.dodgeRate, art, samples
    };
    cardStore.cards.push(card);
    const saved = saveCards();
    renderCardList();
    showScanPanel('main');
    scanner.resumeAt = performance.now() + 1800; // 등록하자마자 바로 소환되지 않게 잠깐 쉼
    setScanStatus(`${card.name} 카드를 등록했어요! 이제 이 카드를 비추면 ${card.name}${josa(card.name, '이', '가')} 소환돼요.`
      + (saved ? '' : ' (이 브라우저는 저장이 막혀 있어 새로고침하면 등록이 사라져요)'));
  }
  // 등록 순서: ① 틀 안의 카드를 찍고 ② 어떤 포켓몬인지 고름 (틀을 한 번만 맞추면 됨)
  async function captureLiveCard() {
    if (scanner.busy || cardLimitReached()) return;
    if (!isCameraLive()) { refreshScannerNotice(); return; }
    const crop = videoCropForFrame();
    if (!crop) return;
    if (CardMatcher.describe(video, crop).contrast < CARD_MIN_CONTRAST) {
      setScanStatus('틀 안에 카드가 잘 안 보여요. 카드를 틀에 꽉 차게 맞추고 다시 눌러 주세요.');
      return;
    }
    scanner.busy = true;
    btnCaptureLive.disabled = true;
    try {
      const cap = { samples: buildCardSamples(video, crop), art: extractCardArt(video, crop) };
      setScanStatus('카드를 찍는 중… 그대로 들고 있어 주세요.');
      for (let i = 0; i < 2; i++) { // 0.4초 동안 두 장 더 찍어 손떨림·빛 변화도 함께 기억
        await sleep(200);
        const c = videoCropForFrame();
        if (c) cap.samples.push(CardMatcher.describe(video, c));
      }
      openLabelSheet(cap);
    } finally {
      scanner.busy = false;
      btnCaptureLive.disabled = !isCameraLive();
    }
  }
  function openLabelSheet(cap) {
    pendingCapture = cap;
    regThumb.hidden = !cap.art;
    if (cap.art) regThumb.src = cap.art; else regThumb.removeAttribute('src');
    regCustom.hidden = regSelect.value !== 'custom';
    showScanPanel('label');
    setScanStatus('찍은 카드가 어떤 포켓몬인지 골라 주세요.');
  }
  async function saveLabeledCard() {
    if (!pendingCapture) { showScanPanel('main'); refreshScannerNotice(); return; }
    const form = readRegistrationForm();
    if (!form) return;
    const btn = $('btn-reg-save');
    btn.disabled = true;
    try {
      const info = await resolveRegistrationInfo(form);
      const cap = pendingCapture;
      pendingCapture = null;
      finishRegistration(info, cap.samples, cap.art);
    } finally {
      btn.disabled = false;
    }
  }

  // 사진으로 등록·인식: 고른 사진을 화면에 띄우고 끌기·확대로 카드를 틀에 맞춤
  function pickPhoto(purpose) {
    photoStage.purpose = purpose;
    photoInput.value = '';
    photoInput.click();
  }
  photoInput.addEventListener('change', () => {
    const file = photoInput.files && photoInput.files[0];
    if (file) openPhotoStage(file);
  });
  function openPhotoStage(file) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      // 큰 사진은 긴 변 1600px로 줄여서 사용 (메모리 절약)
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      photoView.width = Math.max(1, Math.round(img.naturalWidth * k));
      photoView.height = Math.max(1, Math.round(img.naturalHeight * k));
      photoView.getContext('2d').drawImage(img, 0, 0, photoView.width, photoView.height);
      scanner.mode = 'photo';
      scanFrame.classList.remove('found');
      showScanPanel('align'); // 틀 위치가 확정된 뒤에 사진 위치를 계산
      // 처음 위치: 사진 가운데의 카드 비율 영역(90%)이 틀에 딱 맞게
      const fr = scanFrame.getBoundingClientRect();
      const pw = photoView.width, ph = photoView.height;
      let cw = pw * 0.9, ch = cw / CARD_ASPECT;
      if (ch > ph * 0.9) { ch = ph * 0.9; cw = ch * CARD_ASPECT; }
      photoStage.s0 = fr.width / cw;
      photoStage.zoom = 1;
      alignZoom.value = '1';
      photoStage.tx = fr.left - ((pw - cw) / 2) * photoStage.s0;
      photoStage.ty = fr.top - ((ph - ch) / 2) * photoStage.s0;
      applyPhotoTransform();
      photoView.hidden = false;
      setScanStatus('사진을 끌어서 카드를 틀에 맞추고, 크기 막대로 조절한 뒤 [이 위치로 확인]을 눌러 주세요.');
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      setScanStatus('사진을 열 수 없어요. 다른 사진(JPG·PNG)을 골라 주세요.');
    };
    img.src = url;
  }
  function applyPhotoTransform() {
    const s = photoStage.s0 * photoStage.zoom;
    photoView.style.transform = `translate(${photoStage.tx}px, ${photoStage.ty}px) scale(${s})`;
  }
  function setPhotoZoom(z, cx, cy) {
    const fr = scanFrame.getBoundingClientRect();
    if (cx === undefined) { cx = fr.left + fr.width / 2; cy = fr.top + fr.height / 2; }
    const sOld = photoStage.s0 * photoStage.zoom;
    z = THREE.MathUtils.clamp(z, 0.4, 3);
    const sNew = photoStage.s0 * z;
    const ix = (cx - photoStage.tx) / sOld, iy = (cy - photoStage.ty) / sOld;
    photoStage.zoom = z;
    photoStage.tx = cx - ix * sNew;
    photoStage.ty = cy - iy * sNew;
    alignZoom.value = String(z);
    applyPhotoTransform();
  }
  alignZoom.addEventListener('input', () => setPhotoZoom(Number(alignZoom.value)));
  photoView.addEventListener('wheel', (e) => {
    e.preventDefault();
    setPhotoZoom(photoStage.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08), e.clientX, e.clientY);
  }, { passive: false });
  photoView.addEventListener('pointerdown', (e) => {
    try { photoView.setPointerCapture(e.pointerId); } catch (_) {}
    photoStage.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (photoStage.pointers.size === 2) {
      const [a, b] = [...photoStage.pointers.values()];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, s = photoStage.s0 * photoStage.zoom;
      photoStage.pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: photoStage.zoom, ix: (mx - photoStage.tx) / s, iy: (my - photoStage.ty) / s };
    }
  });
  photoView.addEventListener('pointermove', (e) => {
    const p = photoStage.pointers.get(e.pointerId);
    if (!p) return;
    const px = p.x, py = p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (photoStage.pointers.size === 1) {
      photoStage.tx += p.x - px; photoStage.ty += p.y - py;
      applyPhotoTransform();
    } else if (photoStage.pinch) {
      const [a, b] = [...photoStage.pointers.values()];
      const z = THREE.MathUtils.clamp(photoStage.pinch.z0 * Math.hypot(a.x - b.x, a.y - b.y) / photoStage.pinch.d0, 0.4, 3);
      const s = photoStage.s0 * z, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      photoStage.zoom = z;
      photoStage.tx = mx - photoStage.pinch.ix * s;
      photoStage.ty = my - photoStage.pinch.iy * s;
      alignZoom.value = String(z);
      applyPhotoTransform();
    }
  });
  const endPhotoPointer = (e) => {
    photoStage.pointers.delete(e.pointerId);
    if (photoStage.pointers.size < 2) photoStage.pinch = null;
  };
  photoView.addEventListener('pointerup', endPhotoPointer);
  photoView.addEventListener('pointercancel', endPhotoPointer);
  function photoCropRect() {
    const fr = scanFrame.getBoundingClientRect(), s = photoStage.s0 * photoStage.zoom;
    return { sx: (fr.left - photoStage.tx) / s, sy: (fr.top - photoStage.ty) / s, sw: fr.width / s, sh: fr.height / s };
  }
  function hidePhotoStage() {
    photoView.hidden = true;
    photoStage.pointers.clear();
    photoStage.pinch = null;
    scanner.mode = 'live';
  }
  function confirmPhoto() {
    const crop = photoCropRect();
    if (photoStage.purpose === 'register') {
      if (CardMatcher.describe(photoView, crop).contrast < CARD_MIN_CONTRAST) {
        setScanStatus('틀 안에 카드가 잘 안 보여요. 사진을 움직여 카드를 틀에 맞춰 주세요.');
        return;
      }
      const cap = { samples: buildCardSamples(photoView, crop), art: extractCardArt(photoView, crop) };
      hidePhotoStage();
      openLabelSheet(cap);
    } else {
      const desc = CardMatcher.describe(photoView, crop);
      hidePhotoStage();
      showScanPanel('main');
      scanner.resumeAt = performance.now() + 4000; // 결과 문구를 실시간 인식 안내가 바로 덮어쓰지 않게
      if (!cardStore.cards.length) { setScanStatus('아직 등록된 카드가 없어요. 먼저 카드를 등록해 주세요.'); return; }
      const m = matchCards(desc);
      const card = decideCard(m);
      if (card) { summonFromCard(card); return; }
      setScanStatus(m.best
        ? `등록한 카드와 맞지 않아요. 가장 비슷한 카드는 ${m.best.card.name} (${Math.round(m.best.score * 100)}%)예요. 카드를 틀에 꽉 차게 맞추거나 이 카드를 등록해 주세요.`
        : '등록한 카드와 맞지 않아요.');
    }
  }

  btnCard.addEventListener('click', openScanner);
  $('btn-scan-close').addEventListener('click', closeScanner);
  btnCaptureLive.addEventListener('click', captureLiveCard);
  $('btn-capture-photo').addEventListener('click', () => { if (!cardLimitReached()) pickPhoto('register'); });
  $('btn-scan-photo').addEventListener('click', () => pickPhoto('recognize'));
  $('btn-reg-save').addEventListener('click', saveLabeledCard);
  $('btn-reg-cancel').addEventListener('click', () => {
    pendingCapture = null;
    showScanPanel('main');
    refreshScannerNotice();
  });
  $('btn-align-ok').addEventListener('click', confirmPhoto);
  $('btn-align-cancel').addEventListener('click', () => {
    hidePhotoStage();
    showScanPanel('main');
    refreshScannerNotice();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && scanner.open) closeScanner(); });

  // 13. 메인 게임 루프 — 경과 시간(dt) 기반이라 60Hz·120Hz 화면에서 속도가 같음
  const clock = new THREE.Clock();
  let elapsed = 0;
  let loopErrorShown = false;
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05); // 탭 전환 뒤 큰 시간 점프 방지
    elapsed += dt;
    try {
      frameNo++;
      const now = performance.now();
      fitCameraFov();
      updateCameraOrientation();
      if (!uiPaused()) { // 카드 스캔·가방 화면이 열려 있는 동안엔 전투·사물 인식을 잠시 멈춤
        if (isArMode() && DETECTOR.state === 'off') ensureDetector();
        runDetection(now);
        updatePokemon(dt);
        updatePartner(dt, now);
        updateProjectiles(dt);
        updateWalk(now);
      }
      if (pokemonMesh.visible) playAnimatedFrames(pokeVisual, dt);
      if (partnerMesh.visible) playAnimatedFrames(partner.visual, dt);
      updateHandBall(dt);
      updateRing(dt);
      updateEffects(dt);
      updateIndicator();
      updatePartnerTag();
      if (!scanner.open) {
        renderer.clear();
        renderer.render(scene, camera);
        if (handBall.visible) { renderer.clearDepth(); renderer.render(overlayScene, camera); } // 손에 든 공은 맨 앞에
      }
    } catch (err) {
      if (!loopErrorShown) { loopErrorShown = true; reportError(err); }
    }
  }

  // 화면 회전 및 리사이즈 대응
  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    measureUiBounds();
    layoutScanFrame();
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 250));

  // 그래픽 컨텍스트 손실(백그라운드 전환 등) 안내
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    logStatus('⚠️ 그래픽이 잠시 초기화됐어요. 자동으로 복구를 시도합니다.');
  });
  canvas.addEventListener('webglcontextrestored', () => logStatus('그래픽이 복구됐어요.'));

  // 시작
  loadCards();
  loadCollection();
  populateRegSelect();
  measureUiBounds();
  updateGyroButton();
  updateWalkPill();
  updateBagBadge();
  if (partnerMon()) setPartner(partnerMon());               // 저장된 파트너가 다시 옆에 나옴
  spawnPokemon({ id: 25 });                                  // 첫 만남은 피카츄
  initCamera();
  animate();
  if (!collection.mons.length && !collection.starterAsked) setTimeout(openStarter, 900);
  // 안드로이드는 권한 없이 움직임 센서를 쓸 수 있음 (iOS는 첫 터치 때 함께 요청)
  if (typeof window.DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function') ensureMotion();
</script>
</body>
</html>
